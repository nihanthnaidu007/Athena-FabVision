name: ci

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff>=0.13'
      - name: Lint
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked dependencies (reproducible build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Install test tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  pip-audit:
    name: pip-audit (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Audit installed environment against OSV
        run: |
          # The runner preinstalls setuptools versions carrying known
          # advisories (e.g. PYSEC-2026-3447, fixed in 83.0.0); upgrade
          # environment tooling first so the audit scans clean versions.
          python -m pip install --upgrade pip pip-audit 'setuptools>=83.0.0'
          pip-audit

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action v2 reads PR commits via the API in pull_request
      # events (GET /pulls/{n}/commits); the token-level default denies it
      # without this, 403ing before any scan runs.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: athena-fabvision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke -- container boots and serves the health endpoints
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY=smoke-only-key athena-fabvision:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/ > /dev/null; then break; fi
            sleep 2
          done
          echo '-- liveness --'
          curl -fsS http://127.0.0.1:8000/healthz/
          echo
          echo '-- readiness --'
          curl -fsS http://127.0.0.1:8000/healthz/ready/
          echo
          docker rm -f smoke
