name: gitleaks

# Full-history secret scan on every push to the protected branches. Pull
# requests are scanned by ci.yml's gitleaks job, so this workflow only
# covers pushes (including release-branch pushes, which never target main).
on:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
