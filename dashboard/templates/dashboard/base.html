<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Athena FabVision{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #555; }
        h2 { color: #555; }
        nav {
            display: flex;
            gap: 16px;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        nav a { color: #007bff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav .spacer { flex: 1; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e5e5e5; }
        th { background: #f8f9fa; color: #555; }
        .cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
        .card { flex: 1; background: #e9ecef; border-radius: 5px; padding: 12px; }
        .card .value { font-size: 22px; font-weight: bold; }
        .card .label { font-size: 12px; color: #666; }
        button, .btn {
            display: inline-block;
            padding: 8px 14px;
            font-size: 14px;
            color: #fff;
            background: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover, .btn:hover { background: #0056b3; }
        button.danger { background: #d9534f; }
        button.danger:hover { background: #b52b27; }
        form.inline { display: inline; }
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .banner {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 16px;
        }
        .banner code { word-break: break-all; }
        .muted { color: #666; }
        .errors { color: #b52b27; font-size: 13px; }
        .field { margin-bottom: 12px; }
        .field label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        .window-selector a { margin-right: 8px; }
        .window-selector a.active { font-weight: bold; }
        svg.chart {
            width: 100%;
            height: auto;
            background: #fafbfc;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .empty {
            padding: 24px;
            text-align: center;
            color: #666;
            background: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <strong>Athena FabVision</strong>
            <a href="{% url 'dashboard:usage' %}">Usage</a>
            <a href="{% url 'dashboard:documents' %}">Documents</a>
            <a href="{% url 'dashboard:review' %}">Review</a>
            <a href="{% url 'dashboard:notebooks' %}">Notebooks</a>
            <a href="{% url 'dashboard:keys' %}">API Keys</a>
            <span class="spacer"></span>
            {% if user.is_authenticated %}
                <span class="muted">{{ user.username }}</span>
                <form class="inline" method="post" action="{% url 'dashboard:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% endif %}
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
